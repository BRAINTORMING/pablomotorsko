[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Public values (the publishable key is meant to be in the browser; security comes from the RLS policies).
  VITE_SUPABASE_URL = "https://jegedgxhscwsfkdqynwz.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_HdZT4S-Btbo_CWndx0_03A_bQREfieG"
  # Netlify's secret scanner would otherwise fail the build because these public values end up in the JS bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# The site uses hash routes (#/admin), so no rewrites are needed; this keeps deep links safe anyway.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
